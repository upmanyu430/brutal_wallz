name: brutal_wallz
description: "A new Nowa project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  dio: ^5.11.1
  go_router: ^16.1.0
  google_fonts: ^6.3.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  gal: ^2.3.3
  async_wallpaper:
    path: packages/async_wallpaper
  custom_refresh_indicator: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/wallpapers/
    - assets/wallpapers.json
