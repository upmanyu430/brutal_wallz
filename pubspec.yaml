name: brutal_wallz
description: "A new Nowa project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  nowa_runtime: ^0.1.3
  provider: ^6.1.5
  shared_preferences: any
  dio: any
  go_router: any
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/wallpapers/
    - assets/wallpapers.json
